[workspace]
resolver = "3"

members = [
    "crates/builder",
    "crates/gateway",
    "crates/registry",
    "crates/registry/migration",
    "crates/libs/*",
]

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tokio = "1.53.1"
